<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    .initProcess {
      background-color: #fff;
      border: 1px solid transparent;
      border-radius: 8px;
      box-shadow: 0 4px 8px 3px rgb(60, 64, 67 / 15%);
      position: absolute;
      z-index: 1003;
      padding: 5px;
      background-color: white;
      font-weight: normal;
      font-family: Roboto, RobotoDraft, Helvetica, Aria, sans-serif;
      font-size: 1.2rem;
    }

    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 50px;
    }
    #okButton {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="initProcess">
    <div id="loading">
      <img src="https://www.google.com/images/spin-32.gif" alt="Carregando...">
    </div>
    <span><?= mensagem ?></span>
  </div>
  <div id="status"></div>

</body>
</html>
